<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="profile.css">
    <title>DataOwls Profile</title>

   
</head>


<body>

<header class="site-header">
        <div class="site-header__inner">
            <a class="title discover-brand" href="../index.html" aria-label="DataOwls home">
                <img src="../assets/owl-d.png" alt="D" class="logo-owl">
                <span class="logo-letter">a</span>
                <span class="logo-letter">t</span>
                <span class="logo-letter">a</span>
                <span class="logo-letter">O</span>
                <span class="logo-letter">w</span>
                <span class="logo-letter">l</span>
                <span class="logo-letter">s</span>
            </a>

            <nav class="navigation" aria-label="Main navigation">
                <a href="../index.html#featured-stories">Explore Stories</a>
                <a href="discover.html">Discover</a>
            </nav>

            <div class="auth-acts" aria-label="Account actions">
                <a class="login-button" href="login.html">Login</a>
                <a class="signup-button" href="signup.html">Sign Up</a>
                <a class="profile-link" href="profile.html" aria-label="View profile" title="Profile">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <circle cx="12" cy="8" r="3.5"></circle>
                        <path d="M5.5 20a6.5 6.5 0 0 1 13 0"></path>
                    </svg>
                </a>
            </div>
        </div>
    </header>

    <div class="screen-container">

        <!-- Profile -->
        <section class="profile-info">

            <div class="side-container">
            <div class="box-one">
                <img class="profilePic" id="profilePic" src="../assets/owl-d.png" alt="Profile Picture">

                <select id="owl-selection" name="owl-selection">
                    <option value="owl1">Owl 1</option>
                    <option value="owl2">Owl 2</option>
                    <option value="owl3">Owl 3</option>
                    <option value="owl4">Owl 4</option>
                </select>
            </div>

            <div class="box-two">

                <p><strong>Username</strong></p>

                <p>0 Followers | 0 Following</p>

                <div class="role-container">
                    <label for="custom-role">Role</label>

                    <select id="custom-role" name="custom-role">
                        <option value="Developer">Developer</option>
                        <option value="Professor">Professor</option>
                        <option value="Teacher">Teacher</option>
                        <option value="Student">Student</option>
                    </select>
                </div>

            </div>

        </div>

        <div class="bio-container">
            <label for="bio">Bio</label>
            <input type="text" id="bio" name="bio" maxlength="160" placeholder="Write your bio..." aria-label="Bio">
        </div>

        </section>

        <!-- Posts, reposts, and saved tabs -->
        <section class="Dataset-content">

            <button class="Datasets" type="button" aria-label="Posts">
                <img src="posts.png" alt="Posts">
            </button>

            <button class="Datasets" type="button" aria-label="Reposts">
                <img src="reposts.png" alt="Reposts">
            </button>

            <button class="Datasets" type="button" aria-label="Saved">
                <img src="saved.png" alt="Saved">
            </button>

        </section>

        <!-- Post gallery -->
        <section>

            <table class="data-table">
                <tbody>
                <tr>

                    <td>
                        <img src="pinned.png" class="post-icons" alt="Pinned">
                        <p>Post 1</p>
                    </td>

                    <td>
                        <img src="collaborated.png" class="post-icons" alt="Collaborated">
                        <p>Post 2</p>
                    </td>

                    <td>
                        <img src="solo.png" class="post-icons" alt="Solo">
                        <p>Post 3</p>
                    </td>

                </tr>
                </tbody>
            </table>

        </section>

    </div>

</body>
</html>
