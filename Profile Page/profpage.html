<!DOCTYPE html>
<html lang="en">
   <head>
      <title>HTML Practice</title>
      <link rel="stylesheet" href="style.css">
   </head>

   <div class="screen-container">
   <body>
    <!-- profile -->

    <header class = "profile-info">
         <h1 class="logoText">DataOwl</h1>
         <div class="side-container">
            <div class="box-one">
            <img class="profilePic" src="owl.png" alt="Profile Picture">
            </div>
            <div class="box-two">
            <p>Username</p>
            <p>0 Followers | 0 Following</p>
            </div>
            
         </div>
         
         <p>(bio goes here)</p>
         
         <label for="role">Role</label>
         <input type="text" id="custom-role" placeholder="Enter your role">
         <button>Edit Profile</button>

    </header>

    <!-- Posts -->
     <section class = "Dataset-content">

      <button class = "Datasets">
         <img src = "posts.png" alt = "posts">
      </button>
      <button class = "Datasets">
         <img src = "reposts.png" alt = "posts">
      </button>
      <button class = "Datasets">
         <img src = "saved.png" alt = "posts">
      </button>
      

    </section>

    <section>
      <table class="data-table">
         <tr>
            <td>
               <img src="pinned.png" class="post-icons" alt="pinned">
               <p>Post 1</p>
            </td>
            <td>
               <img src="collaborated.png" class="post-icons" alt="collaborated">
               <p>Post 2</p>
            </td>
            <td>
               <img src="solo.png" class="post-icons" alt="solo">
               <p>Post 3</p>
            </td>
         </tr>

      </table>

    </section>
   </body>
   </div>
