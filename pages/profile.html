<!DOCTYPE html>
<html lang="en">
   <head>
      <title>HTML Practice</title>
      <link rel="stylesheet" href="../styles/profile.css">
   </head>

   <div class="screen-container">
   <body>
    <!-- profile -->

    <header class = "profile-info">
         <h1 class="logoText">DataOwl</h1>
         <div class="side-container">
            <div class="box-one">
            <img class="profilePic" src="../assets/dataowls-logo.jpg" alt="Profile Picture">
            </div>
            <div class="box-two">
            <p>Username</p>
            <p>0 Followers | 0 Following</p>
            </div>
            
         </div>
         
         <p>(bio goes here)</p>
         
         <label for="role">Role</label>
         <input type="text" id="custom-role" placeholder="Enter your role">
         <button>Edit Profile</button>

    </header>

    <!-- Posts -->
     <section class = "Dataset-content">

      <button class = "Datasets">
         <img src = "../assets/posts.png" alt = "Posts">
      </button>
      <button class = "Datasets">
         <img src = "../assets/reposts.png" alt = "Reposts">
      </button>
      <button class = "Datasets">
         <img src = "../assets/saved.png" alt = "Saved posts">
      </button>
      

    </section>

    <section>
      <table class="data-table">
         <tr>
            <td>
               <img src="../assets/pinned.png" class="post-icons" alt="Pinned post">
               <p>Post 1</p>
            </td>
            <td>
               <img src="../assets/collaborated.png" class="post-icons" alt="Collaborated post">
               <p>Post 2</p>
            </td>
            <td>
               <img src="../assets/solo.png" class="post-icons" alt="Solo post">
               <p>Post 3</p>
            </td>
         </tr>

      </table>

    </section>
   </body>
   </div>
   </div>
