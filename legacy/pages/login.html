<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | DataOwls</title>
    <link rel="stylesheet" href="../styles/theme.css">
    <link rel="stylesheet" href="../styles/auth.css">
</head>
<body>
    <!-- Shared account-page header -->
    <header class="auth-header">
        <a class="auth-brand" href="../index.html">
            <img src="../assets/owl-d.png" alt="D" class="logo-owl">
            <span class="logo-letter">a</span>
            <span class="logo-letter">t</span>
            <span class="logo-letter">a</span>
            <span class="logo-letter">O</span>
            <span class="logo-letter">w</span>
            <span class="logo-letter">l</span>
            <span class="logo-letter">s</span>
        </a>
        <a class="header-link" href="signup.html">Create an account</a>
    </header>

    <!-- Login form -->
    <main class="auth-main">
        <section class="auth-card" aria-labelledby="page-title">
            <h1 id="page-title">Welcome back</h1>
            <p class="auth-intro">Log in to continue exploring and sharing data stories.</p>

            <form class="auth-form">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>

                <div class="label-row">
                    <label for="password">Password</label>
                    <a href="#">Forgot password?</a>
                </div>
                <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>

                <button class="submit-button" type="submit">Log In</button>
            </form>

            <p class="auth-switch">New to DataOwls? <a href="signup.html">Sign up</a></p>
        </section>
    </main>

    <!-- Return navigation -->
    <footer class="auth-footer"><a href="../index.html">Back to home</a></footer>
</body>
</html>
